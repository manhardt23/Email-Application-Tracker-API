# EC2 production API — image is set at deploy time (ECR URI + tag).
# Expects host env file at /etc/tracker.env (DATABASE_URL, email, LLM keys, etc.).
# IMPORTANT: DATABASE_URL in /etc/tracker.env must use host `db`, not `localhost`.
services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: job_tracker
      POSTGRES_USER: job_tracker_user
      POSTGRES_PASSWORD: job_tracker_pass
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U job_tracker_user -d job_tracker"]
      interval: 5s
      timeout: 5s
      retries: 20

  api:
    image: "${TRACKER_IMAGE}"
    ports:
      - "8000:8000"
    env_file:
      - /etc/tracker.env
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped

volumes:
  postgres_data:
