[project]
name = "email-application-tracker"
version = "0.1.0"
requires-python = ">=3.12"

[project.optional-dependencies]
dev = [
    "pytest",
    "pytest-cov",
    "httpx",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]
ignore = ["E712"]  # Allow `== True` in SQLAlchemy filter expressions

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "integration: marks tests that require a real (or in-memory) DB and a running app",
    "slow: marks tests that are expected to be slow",
]
# Coverage gate — enforced in CI (Phase 9).
# Run locally: pytest --cov=app --cov-fail-under=70
addopts = "--cov=app --cov-report=term-missing --cov-fail-under=70"
